<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      margin: 0;
    }
    
    .popup-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 5px;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .toggle-container:last-of-type {
      border-bottom: none;
    }
    
    .toggle-label {
      font-size: 13px;
      color: #aaa;
    }
    
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 20px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      border-radius: 20px;
      transition: .3s;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #777;
      border-radius: 50%;
      transition: .3s;
    }
    
    input:checked + .slider {
      background-color: #3ea6ff;
    }
    
    input:checked + .slider:before {
      background-color: white;
      transform: translateX(20px);
    }
    
    .status {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="title">Playlist Organizer</div>
    
    <div class="toggle-container">
      <span class="toggle-label">Sort A-Z</span>
      <label class="toggle-switch">
        <input type="checkbox" id="alphabetSort">
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-container">
      <span class="toggle-label">Group by Tags</span>
      <label class="toggle-switch">
        <input type="checkbox" id="groupByTags">
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="status" id="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
